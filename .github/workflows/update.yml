name: Update README

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest==9.1.1
      - run: python -m pytest -q
      - id: update
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update.py || echo "failed=true" >> "$GITHUB_OUTPUT"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || (git commit -m "Update README blocks" && git pull --rebase && git push)
      - name: Fail if a section failed
        if: steps.update.outputs.failed == 'true'
        run: exit 1
